<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reuben Oluwafemi — Design &amp; Plugin Engineer</title>
    <meta name="description" content="Reuben Oluwafemi is a Design &amp; Frontend Engineer specializing in crafting intuitive user interfaces and developing innovative WordPress plugins." />
    <meta name="theme-color" content="#0A0A0A" />
    <!-- Apply the saved theme before first paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('theme') || 'dark';
          var theme = mode === 'system'
            ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : (mode === 'light' ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#F5F5F2' : '#0A0A0A');
        } catch (e) {}
      })();
    </script>
    <link rel="canonical" href="https://www.usereuben.com/" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Devicon — colored tech & tool logos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
